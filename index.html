<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>My tasks</h1>
      <p id="count" aria-live="polite">0 tasks left</p>
    </header>

    <form id="form" class="add" autocomplete="off">
      <label for="input" class="sr-only">New task</label>
      <input id="input" type="text" placeholder="What needs doing?" maxlength="120" required>
      <button type="submit">Add task</button>
    </form>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden></p>

    <footer class="app__footer">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" data-filter="done" aria-pressed="false">Done</button>
      </div>
      <button type="button" id="clear" class="link">Clear completed</button>
    </footer>
  </main>




  <script type="module" src="./script.js"></script>
</body>
</html>
